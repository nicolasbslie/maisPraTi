<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo CSS Interno</title>

    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: blue;
            text-align: center;
        }

        p {
            color: green;
            font-size: 20px;
            text-align: center;
        }

        .caixa {
            width: 300px;
            margin: 20px auto;
            padding: 15px;
            background-color: white;
            border: 2px solid black;
        }

        .caixa p {
            color: red;
        }
    </style>

</head>
<body>

    <h1>CSS Interno</h1>

    <p>Este parágrafo está estilizado usando CSS Interno.</p>

    <div class="caixa">
        <p>Todo o CSS está dentro da tag &lt;style&gt;.</p>
    </div>

</body>
</html>
