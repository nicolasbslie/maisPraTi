<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo CSS Inline</title>
</head>
<body style="background-color: #f0f0f0; font-family: Arial, sans-serif;">

    <h1 style="color: blue; text-align: center;">
        CSS Inline
    </h1>

    <p style="color: green; font-size: 20px; text-align: center;">
        Este parágrafo está estilizado usando CSS Inline.
    </p>

    <div style="width: 300px; margin: 20px auto; padding: 15px; background-color: white; border: 2px solid black;">
        <p style="color: red;">
            Todo o estilo foi aplicado diretamente nas tags HTML.
        </p>
    </div>

</body>
</html>
