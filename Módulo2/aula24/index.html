<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <h1>Estudos DOM</h1>
    <p>Aprendendo a usar o DOM em javascript</p>
    <p>Aqui que vai mudar</p>
    <p id="msg">Vai mudar outro <b>seletor</b></p>

    <label for="nome">Digite seu nome:</label>
    <input type="text" id="nome" name="nome">
    <button onclick="mostrarNome()">Mostrar</button>
    <p id="resultado"></p>
    <p id="texto">Vamos usar um querySelector()</p>

    <script>
        let paragrafo = document.getElementsByTagName('p')[1]

        paragrafo.innerText = "Texto alterado pelo javascript"
        paragrafo.style.color = 'blue'

        //let p2 = document.getElementById("msg")
        let p2 = document.getElementsByClassName("msg")[2]
        p2.innerHTML = "Usamos o seletor <strong>ID</strong> para mudar o texto"

        function mostrarNome(){
            let nome = document.getElementsByName("nome")[0].value

            document.getElementById("resultado").innerText = `Olá, ${nome}, seja bem vindo!`
        }

        let texto = document.querySelector("#texto")
        texto.innerText = "Usamos o querySelector pelo TAG"
    </script>
</body>
</html>
