<!DOCTYPE html>
<!-- Informa ao navegador que este documento utiliza HTML5 -->

<html lang="pt-BR">
<!-- Elemento raiz da página.
     O atributo lang define o idioma principal do conteúdo. -->

<head>
    <!-- Área que contém informações sobre a página,
         mas que não aparecem diretamente para o usuário. -->

    <meta charset="UTF-8">
    <!-- Define a codificação de caracteres como UTF-8,
         permitindo o uso correto de acentos e caracteres especiais. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Faz a página se adaptar corretamente a dispositivos móveis,
         ajustando a largura ao tamanho da tela. -->

    <title>Document</title>
    <!-- Título da página exibido na aba do navegador. -->
</head>

<body>
    <!-- Corpo da página.
         Todo o conteúdo visível para o usuário fica aqui:
         textos, imagens, botões, formulários, etc. -->

</body>

</html>
<!-- Fechamento do documento HTML -->
